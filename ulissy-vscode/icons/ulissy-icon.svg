<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="#1a1a2e"/>
  
  <!-- Hexagon (H3 cell representation) -->
  <polygon 
    points="64,20 100,40 100,80 64,100 28,80 28,40" 
    fill="none" 
    stroke="#00d4aa" 
    stroke-width="4"
    stroke-linejoin="round"/>
  
  <!-- Inner hexagon (trajectory) -->
  <polygon 
    points="64,35 85,47 85,73 64,85 43,73 43,47" 
    fill="none" 
    stroke="#00d4aa" 
    stroke-width="2"
    stroke-linejoin="round"
    stroke-dasharray="8,4"/>
  
  <!-- Center dot (current location) -->
  <circle cx="64" cy="60" r="8" fill="#00d4aa"/>
  
  <!-- Trajectory path dots -->
  <circle cx="48" cy="52" r="3" fill="#00d4aa" opacity="0.6"/>
  <circle cx="52" cy="68" r="3" fill="#00d4aa" opacity="0.7"/>
  <circle cx="76" cy="70" r="3" fill="#00d4aa" opacity="0.8"/>
  <circle cx="80" cy="54" r="3" fill="#00d4aa" opacity="0.5"/>
  
  <!-- U letter stylized -->
  <text 
    x="64" 
    y="115" 
    font-family="Arial, sans-serif" 
    font-size="24" 
    font-weight="bold"
    fill="#ffffff" 
    text-anchor="middle">
    UL
  </text>
</svg>
