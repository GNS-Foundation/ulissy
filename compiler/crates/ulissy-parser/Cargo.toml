[package]
name = "ulissy-parser"
version = "0.1.0"
edition = "2021"
authors = ["GNS Foundation <foundation@gns.foundation>"]
description = "Parser for the ULissy programming language - converts tokens to AST"
license = "MIT"
repository = "https://github.com/GNS-Foundation/ulissy"
keywords = ["parser", "compiler", "ulissy", "gns", "geospatial"]
categories = ["compilers", "parsing"]

[lib]
name = "ulissy_parser"
path = "src/lib.rs"

[[bin]]
name = "ulissy-parse"
path = "src/main.rs"

[dependencies]
ulissy-lexer = { path = "../ulissy-lexer" }

[dev-dependencies]
pretty_assertions = "1.4"
